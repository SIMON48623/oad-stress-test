[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oad-stress-test"
version = "1.0.0"
description = "Feature-level stress-test protocol for resource-constrained online action detection."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Yuzhang Wu"}]
license = {text = "MIT"}
keywords = ["online action detection", "video recognition", "reliability", "calibration", "temporal transitions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "scikit-learn>=1.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/SIMON48623/oad-stress-test"
Repository = "https://github.com/SIMON48623/oad-stress-test"
Issues = "https://github.com/SIMON48623/oad-stress-test/issues"

[tool.setuptools.packages.find]
where = ["src"]
